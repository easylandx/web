<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EasyLandX · Mobile Showcase</title>
<style>
:root{--gold:#ffd23f;--cyan:#27f0ff;--deep:#1c0a5c;--w:min(100vw,560px,max(390px,50dvh))}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(circle at 50% 25%,#5b14ff,#1c0a5c 75%);color:#fff;font:15px/1.3 -apple-system,system-ui,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
.bg{position:fixed;inset:0;touch-action:none;cursor:grab}
.screen{position:fixed;top:0;bottom:0;width:var(--w);left:calc(50% - var(--w)/2);overflow:hidden;background:#12082e;z-index:1;box-shadow:0 0 70px rgba(0,0,0,.55)}
.track{position:absolute;inset:0;display:flex;will-change:transform}
.slide{flex:0 0 100%;position:relative;overflow:hidden;background:#12082e}
.slide.pop{animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:12%;font-weight:800;font-size:20px;color:var(--gold)}
.slide iframe{position:absolute;top:0;left:0;border:0;background:#fff;transform-origin:0 0}
.zone{position:absolute;top:0;bottom:0;width:26px;z-index:5;touch-action:none;cursor:grab}
.zl{left:0}.zr{right:0}
.glass{position:fixed;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:8px;padding:8px;border-radius:18px;background:rgba(24,8,72,.62);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(255,255,255,.22);box-shadow:0 8px 30px rgba(0,0,0,.45);width:min(94vw,460px)}
.top{top:max(10px,env(safe-area-inset-top));font-size:13px;padding:6px 8px}
.top span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.top a{color:var(--cyan);text-decoration:none;font-weight:800;padding:4px 6px}
.bar{bottom:max(12px,env(safe-area-inset-bottom))}
.bar.min{width:auto}.bar.min>*:not(#tg){display:none}
.b{border:0;border-radius:12px;padding:9px 12px;font:700 15px inherit;font-family:inherit;background:var(--gold);color:var(--deep);cursor:pointer;white-space:nowrap;text-decoration:none}
.b:active{transform:scale(.95)}
.b.alt{background:rgba(255,255,255,.18);color:#fff}
input{flex:1;min-width:0;border-radius:12px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;padding:9px 11px;font:inherit;-webkit-user-select:text;user-select:text}
input:focus{outline:0;border-color:var(--cyan)}
.res{position:absolute;bottom:calc(100% + 8px);left:0;right:0;background:rgba(20,7,61,.95);border:1px solid rgba(255,255,255,.2);border-radius:14px;max-height:45vh;overflow:auto;display:none}
.res div{padding:8px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.08)}
.res div:hover,.res .on{background:rgba(39,240,255,.2)}
.res small{display:block;opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint{position:fixed;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 52px);transform:translateX(-50%);z-index:19;background:rgba(0,0,0,.6);padding:7px 12px;border-radius:14px;font-size:12px;white-space:nowrap;pointer-events:none;animation:fade 6s forwards}
@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}
@media(max-width:480px){.t{display:none}.hint{white-space:normal;width:86vw;text-align:center}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="screen" id="screen">
  <div class="track" id="track"><div class="slide"><div class="ph">Loading sites…</div></div></div>
</div>
<div class="glass top">
  <a href="https://easylandx.github.io/all/" target="_blank" rel="noopener" title="EasyLandX">🧲</a>
  <span id="lbl">Loading…</span>
  <a id="open" href="#" target="_blank" rel="noopener" title="Open in new tab">↗</a>
  <button class="b alt" id="fs" aria-label="Full screen">⛶</button>
</div>
<div class="glass bar" id="bar">
  <div class="res" id="res"></div>
  <button class="b alt" id="prev" aria-label="Previous site">◀</button>
  <button class="b" id="rnd" aria-label="Random site">🎲<span class="t"> Random</span></button>
  <input id="q" type="search" placeholder="Search sites…" autocomplete="off">
  <button class="b alt" id="next" aria-label="Next site">▶</button>
  <button class="b alt" id="tg" aria-label="Hide or show controls">▾</button>
</div>
<div class="hint">Swipe ⇄ to change site · drag to scroll · ← → keys · “/” to search</div>

<script>
const IDX='https://easylandx.github.io/all/', W=390; // mobile CSS width, even on desktop
const $=s=>document.querySelector(s), track=$('#track'), scr=$('#screen'), q=$('#q'), res=$('#res');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const FALL='work make give disc parad core swan scou how brai trig change influence social human choice'.split(' ');
let S=[], cur=0;

async function loadList(){
  let list=[];
  try{
    const t=await (await fetch(IDX)).text(), seen=new Set();
    const d=new DOMParser().parseFromString(t,'text/html');
    d.querySelectorAll('a[href]').forEach(a=>{
      let u; try{u=new URL(a.getAttribute('href'),IDX)}catch(e){return}
      if(!/\/all\/[\w-]+\.html$/.test(u.pathname)||/\/index\.html$/.test(u.pathname)||seen.has(u.href))return;
      seen.add(u.href);
      let L=[...a.querySelectorAll('*')].filter(e=>!e.children.length).map(e=>e.textContent.trim()).filter(x=>x&&!/^Open\s*→?$/.test(x));
      if(!L.length)L=[a.textContent.replace(/Open\s*→/,'').trim()||cap(u.pathname.split('/').pop().replace('.html',''))];
      let ic=''; if(L.length>1&&/^[^\p{L}\p{N}]{1,8}$/u.test(L[0]))ic=L.shift();
      list.push({u:u.href,t:(ic?ic+' ':'')+L[0],d:L.slice(1).join(' ')});
    });
    if(list.length<20){ // page may be script-rendered: scan raw text for page names
      list=[]; seen.clear();
      for(const m of t.matchAll(/["'(\/]([a-z0-9-]+)\.html/gi)){
        const s=m[1]; if(['index','all'].includes(s)||seen.has(s))continue; seen.add(s);
        list.push({u:IDX+s+'.html',t:cap(s),d:''});
      }
    }
  }catch(e){}
  if(list.length<5) list=FALL.map(s=>({u:IDX+s+'.html',t:cap(s),d:''}));
  return list;
}

function sizeF(f){const k=scr.clientWidth/W;f.style.width=W+'px';f.style.height=(scr.clientHeight/k)+'px';f.style.transform='scale('+k+')'}
function sync(){
  [...track.children].forEach((sl,i)=>{
    const need=Math.abs(i-cur)<=1, f=sl.querySelector('iframe');
    if(need&&!f)mkFrame(i);
    else if(!need&&f)f.remove();
  });
}
function ui(){
  $('#lbl').textContent=(cur+1)+' / '+S.length+' · '+S[cur].t;
  $('#open').href=S[cur].u;
}
function go(i){
  i=(i+S.length)%S.length;
  const far=Math.abs(i-cur)>1; cur=i; sync();
  track.style.transition=far?'none':'transform .35s cubic-bezier(.2,.8,.2,1)';
  track.style.transform='translateX('+(-cur*100)+'%)';
  if(far){const sl=track.children[cur];sl.classList.remove('pop');void sl.offsetWidth;sl.classList.add('pop')}
  ui();
}
function rnd(){if(S.length<2)return;let i;do{i=Math.floor(Math.random()*S.length)}while(i===cur);go(i)}

// Pages are fetched and injected via srcdoc so they are same-origin with this file:
// that lets us add mouse-drag scrolling and left/right swipes anywhere on the screen.
const cache=new Map();
let wl=0;
function wheelNav(e){
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY)&&Math.abs(e.deltaX)>15){
    e.preventDefault();const n=Date.now();
    if(n-wl>450){wl=n;go(cur+(e.deltaX>0?1:-1))}
  }
}
function endH(dx,dt){
  const v=dx/Math.max(1,dt),th=scr.clientWidth*.18;
  if(dx<-th||(v<-.5&&dx<-30))go(cur+1);
  else if(dx>th||(v>.5&&dx>30))go(cur-1);
  else go(cur);
}
function mkFrame(i){
  const fr=document.createElement('iframe');
  fr.title=S[i].t;fr.allow='fullscreen';
  track.children[i].appendChild(fr);sizeF(fr);
  fr.addEventListener('load',()=>{if(fr.dataset.mode==='doc')hook(fr)});
  loadDoc(fr,i);
}
async function loadDoc(fr,i){
  try{
    let h=cache.get(i);
    if(!h){
      const r=await fetch(S[i].u);if(!r.ok)throw 0;
      h=await r.text();
      const b='<base href="'+S[i].u+'">';
      h=/<head(\s[^>]*)?>/i.test(h)?h.replace(/<head(\s[^>]*)?>/i,m=>m+b):b+h;
      cache.set(i,h);
    }
    if(!fr.isConnected)return;
    fr.dataset.mode='doc';fr.srcdoc=h;
  }catch(e){ // fallback: normal cross-origin embed (edge/bezel swipes still work)
    if(fr.isConnected){
      fr.dataset.mode='src';fr.src=S[i].u;
      ['zl','zr'].forEach(c=>{const z=document.createElement('div');z.className='zone '+c;fr.parentNode.appendChild(z);swipe(z)});
    }
  }
}
function hook(fr){
  const d=fr.contentDocument;if(!d||!d.documentElement)return;
  const st=d.createElement('style');
  st.textContent='html,body{-webkit-user-select:none!important;user-select:none!important;touch-action:pan-y;cursor:grab}*{-webkit-user-drag:none}input,textarea{-webkit-user-select:text!important;user-select:text!important}';
  (d.head||d.documentElement).appendChild(st);
  d.addEventListener('selectstart',e=>{if(!/^(INPUT|TEXTAREA)$/.test(e.target.tagName))e.preventDefault()});
  d.addEventListener('dragstart',e=>e.preventDefault());
  const root=()=>d.scrollingElement||d.documentElement;
  let id=null,x0=0,y0=0,t0=0,top0=0,mode=null,moved=false,vy=0,ly=0,lt=0,dxs=0;
  d.addEventListener('pointerdown',e=>{
    if(e.button!==0||(e.target.closest&&e.target.closest('input,textarea,select')))return;
    cancelAnimationFrame(fr._raf);
    id=e.pointerId;x0=e.clientX;y0=ly=e.clientY;lt=t0=performance.now();
    top0=root().scrollTop;mode=null;moved=false;vy=0;dxs=0;
  });
  d.addEventListener('pointermove',e=>{
    if(e.pointerId!==id)return;
    const dx=e.clientX-x0,dy=e.clientY-y0,k=scr.clientWidth/W;
    if(!mode){
      if(Math.hypot(dx,dy)<8)return;
      mode=Math.abs(dx)>Math.abs(dy)?'h':'v';moved=true;
      try{d.documentElement.setPointerCapture(id)}catch(_){}
      if(mode==='h')track.style.transition='none';
    }
    if(mode==='h'){
      dxs=dx*k;
      track.style.transform='translateX(calc('+(-cur*100)+'% + '+dxs+'px))';
    }else if(e.pointerType==='mouse'){
      root().scrollTop=top0-dy;
      const n=performance.now();vy=(e.clientY-ly)/Math.max(1,n-lt);ly=e.clientY;lt=n;
    }
  });
  const up=e=>{
    if(e.pointerId!==id)return;id=null;
    if(mode==='h')endH(dxs,performance.now()-t0);
    else if(mode==='v'&&e.pointerType==='mouse'&&Math.abs(vy)>.1){
      let v=vy;
      const step=()=>{root().scrollTop-=v*16;v*=.95;if(Math.abs(v)>.02)fr._raf=requestAnimationFrame(step)};
      step();
    }
  };
  d.addEventListener('pointerup',up);d.addEventListener('pointercancel',up);
  d.addEventListener('click',e=>{ // no accidental clicks after a drag; keep navigation inside the showcase
    if(moved){moved=false;e.preventDefault();e.stopPropagation();return}
    const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;
    const h=a.getAttribute('href');e.preventDefault();
    if(h&&h[0]==='#'){const t=d.getElementById(decodeURIComponent(h.slice(1)));if(t)t.scrollIntoView({behavior:'smooth'});return}
    const j=S.findIndex(s=>s.u===a.href);
    if(j>=0)go(j);else window.open(a.href,'_blank','noopener');
  },true);
  d.addEventListener('wheel',wheelNav,{passive:false});
  d.addEventListener('keydown',e=>{
    if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
    if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);
  });
}

// swipe left/right on edges, home bar and bezel (also used for cross-origin fallback pages)
function swipe(el,bezelOnly){
  let x0=0,t0=0,on=false;
  el.addEventListener('pointerdown',e=>{
    if(bezelOnly&&e.target!==el)return;
    on=true;x0=e.clientX;t0=performance.now();el.setPointerCapture(e.pointerId);track.style.transition='none';
  });
  el.addEventListener('pointermove',e=>{
    if(!on)return;
    track.style.transform='translateX(calc('+(-cur*100)+'% + '+(e.clientX-x0)+'px))';
  });
  const end=e=>{
    if(!on)return;on=false;
    endH(e.clientX-x0,performance.now()-t0);
  };
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('wheel',wheelNav,{passive:false});
}
swipe($('#bg'),true); // drag the backdrop beside the phone-width column

// search
let hits=[],sel=0;
function show(){
  const v=q.value.trim().toLowerCase();
  res.innerHTML='';
  if(!v){res.style.display='none';hits=[];return}
  hits=S.map((s,i)=>({s,i})).filter(o=>(o.s.t+' '+o.s.d+' '+o.s.u).toLowerCase().includes(v)).slice(0,8);
  sel=0;
  hits.forEach((o,k)=>{
    const d=document.createElement('div'),b=document.createElement('b'),sm=document.createElement('small');
    b.textContent=o.s.t;sm.textContent=o.s.d||o.s.u;d.append(b,sm);
    if(!k)d.className='on';
    d.onmousedown=e=>{e.preventDefault();pick(o.i)};
    res.appendChild(d);
  });
  if(!hits.length){const d=document.createElement('div');d.textContent='No sites found';res.appendChild(d)}
  res.style.display='block';
}
function pick(i){q.value='';res.style.display='none';q.blur();go(i)}
q.addEventListener('input',show);
q.addEventListener('blur',()=>res.style.display='none');
q.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&hits[sel])pick(hits[sel].i);
  else if(e.key==='Escape'){q.value='';show();q.blur()}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();if(!hits.length)return;
    sel=(sel+(e.key==='ArrowDown'?1:-1)+hits.length)%hits.length;
    [...res.children].forEach((c,k)=>c.classList.toggle('on',k===sel));
  }
});
$('#prev').onclick=()=>go(cur-1);
$('#next').onclick=()=>go(cur+1);
$('#rnd').onclick=rnd;
$('#tg').onclick=()=>{const m=$('#bar').classList.toggle('min');$('#tg').textContent=m?'▴':'▾'};
$('#fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()};
addEventListener('keydown',e=>{
  if(document.activeElement===q)return;
  if(e.key==='ArrowRight')go(cur+1);
  else if(e.key==='ArrowLeft')go(cur-1);
  else if(e.key==='r'||e.key==='R')rnd();
  else if(e.key==='/'){e.preventDefault();q.focus()}
});
new ResizeObserver(()=>track.querySelectorAll('iframe').forEach(sizeF)).observe(scr);

loadList().then(list=>{
  S=list;
  track.innerHTML='';
  S.forEach(s=>{const d=document.createElement('div'),p=document.createElement('div');d.className='slide';p.className='ph';p.textContent=s.t;d.appendChild(p);track.appendChild(d)});
  cur=0;go(0);
});
</script>
</body>
</html>
