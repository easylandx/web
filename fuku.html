<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gatito rebotón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap">
<style>
:root{
  --sky-top:#79c9f2; --sky-bottom:#dff5ea; --hill-a:#5cbb74; --hill-b:#3d9d5e;
  --sun:#ffd257; --ink:#15323b; --pill:rgba(255,255,255,.78); --accent:#ff8a3d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--sky-top:#1c2760; --sky-bottom:#5a5aa0; --hill-a:#2b7a5a; --hill-b:#1d5c45; --sun:#f6f0cf; --ink:#eef6f4; --pill:rgba(18,26,60,.68);}
}
:root[data-theme="dark"]{--sky-top:#1c2760; --sky-bottom:#5a5aa0; --hill-a:#2b7a5a; --hill-b:#1d5c45; --sun:#f6f0cf; --ink:#eef6f4; --pill:rgba(18,26,60,.68);}
html{height:100%; background:linear-gradient(var(--sky-top) 50%, var(--hill-b) 50%); scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; height:100%; position:relative; overflow:hidden; font-family:'Nunito',system-ui,sans-serif; color:var(--ink);
  background:linear-gradient(var(--sky-top),var(--sky-bottom) 78%); -webkit-tap-highlight-color:transparent}
.sun{position:absolute; right:9vmin; top:14vmin; width:16vmin; height:16vmin; border-radius:50%; background:var(--sun); box-shadow:0 0 0 2.4vmin color-mix(in srgb,var(--sun) 35%,transparent)}
.hill{position:absolute; bottom:0; border-radius:50% 50% 0 0 / 100% 100% 0 0}
.hill.a{left:-10%; width:75%; height:17%; background:var(--hill-a)}
.hill.b{right:-12%; width:80%; height:12%; background:var(--hill-b)}
#stage{position:absolute; inset:0}
#cat{position:absolute; left:0; top:0; width:clamp(120px,24vmin,220px); cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:manipulation; will-change:transform}
#tilt,#body{display:block}
#cat img{display:block; width:100%; height:auto; pointer-events:none; -webkit-user-drag:none; filter:drop-shadow(0 10px 8px rgba(20,50,60,.28))}
#bubble{position:absolute; left:50%; top:-40px; transform:translateX(-50%); padding:.25em .7em; border-radius:999px; background:#fff; color:#15323b; font:1.35rem 'Bagel Fat One',system-ui,sans-serif; white-space:nowrap; opacity:0; pointer-events:none; box-shadow:0 4px 12px rgba(0,0,0,.18)}
.bar{position:absolute; left:0; right:0; top:0; display:flex; justify-content:space-between; align-items:center; gap:.75rem; padding:.9rem 1rem; pointer-events:none}
h1{margin:0; font:clamp(1.5rem,5vw,2.3rem)/1 'Bagel Fat One',system-ui,sans-serif; letter-spacing:.01em}
.pill{pointer-events:auto; border:0; border-radius:999px; background:var(--pill); color:var(--ink); font:800 .95rem 'Nunito',system-ui,sans-serif; padding:.55rem 1rem; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px)}
button.pill{cursor:pointer}
button.pill:focus-visible,#go:focus-visible,#cat:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
.score{position:absolute; left:50%; bottom:calc(1rem + 2px); transform:translateX(-50%); display:flex; gap:.6rem; pointer-events:none; z-index:2}
#intro{position:absolute; inset:0; z-index:5; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.1rem; padding:2rem; text-align:center; background:color-mix(in srgb,var(--sky-top) 55%,transparent); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); transition:opacity .5s}
#intro.hide{opacity:0; pointer-events:none}
#intro h2{margin:0; font:clamp(2.4rem,9vw,4.5rem)/1 'Bagel Fat One',system-ui,sans-serif}
#intro p{margin:0; max-width:30ch; font-weight:600; font-size:1.15rem; line-height:1.45}
#go{border:0; border-radius:999px; background:var(--accent); color:#fff; font:1.5rem 'Bagel Fat One',system-ui,sans-serif; padding:.6em 1.6em; cursor:pointer; box-shadow:0 6px 0 #c8611d; transition:transform .12s, box-shadow .12s}
#go:active{transform:translateY(4px); box-shadow:0 2px 0 #c8611d}
</style>
</head>

<div class="score"><span class="pill">Rebotes: <b id="nb">0</b></span><span class="pill">Maullidos: <b id="nm">0</b></span></div>

<div id="intro">
  <h2>Gatito rebotón</h2>
  <p>Un gatito rebota por toda la pantalla mientras cantan los pajarillos. Tócalo y te responderá con un miau.</p>
  <button id="go" type="button">Empezar</button>
</div>

<script>
(function(){
  var stage=document.getElementById('stage'), cat=document.getElementById('cat'), tilt=document.getElementById('tilt'),
      body=document.getElementById('body'), img=document.getElementById('img'), bubble=document.getElementById('bubble'),
      nb=document.getElementById('nb'), nm=document.getElementById('nm'), snd=document.getElementById('snd'), intro=document.getElementById('intro');
  var W,H,cw,ch,x=40,y=80,vx=0,vy=0,speed=260,last=0,bounces=0,meows=0,reduce=false;

  function measure(){
    W=stage.clientWidth; H=stage.clientHeight; cw=cat.offsetWidth; ch=cat.offsetHeight;
    speed=Math.max(240,Math.min(W,H)*0.62);
    x=Math.max(0,Math.min(x,W-cw)); y=Math.max(0,Math.min(y,H-ch));
  }
  function aim(deg){ var a=deg*Math.PI/180; vx=Math.cos(a)*speed*(Math.random()<.5?-1:1); vy=Math.sin(a)*speed*(Math.random()<.5?-1:1); }
  measure(); aim(28+Math.random()*34);
  window.addEventListener('resize',measure);
  if(img.complete) measure(); else img.addEventListener('load',measure);

  function squash(){
    body.animate([{transform:'scale(1,1)'},{transform:'scale(1.16,.84)'},{transform:'scale(.94,1.07)'},{transform:'scale(1,1)'}],{duration:260,easing:'ease-out'});
  }
  function hit(){
    bounces++; nb.textContent=bounces; squash(); pop();
  }

  function frame(t){
    var dt=Math.min(.05,(t-(last||t))/1000); last=t;
    x+=vx*dt; y+=vy*dt;
    var b=false;
    if(x<0){x=0; vx=Math.abs(vx); b=true}
    if(x>W-cw){x=W-cw; vx=-Math.abs(vx); b=true}
    if(y<0){y=0; vy=Math.abs(vy); b=true}
    if(y>H-ch){y=H-ch; vy=-Math.abs(vy); b=true}
    if(b) hit();
    cat.style.transform='translate3d('+x.toFixed(1)+'px,'+y.toFixed(1)+'px,0)';
    tilt.style.transform='rotate('+((vy/speed)*7).toFixed(2)+'deg)';
    img.style.transform='scaleX('+(vx<0?-1:1)+')';
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- Sound (Web Audio, no external files) ---------- */
  var ctx=null, master=null, soundOn=false, birdTimer=null;
  function initAudio(){
    if(ctx) return;
    var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=1; master.connect(ctx.destination);
  }
  function out(node,pan){
    if(ctx.createStereoPanner){ var p=ctx.createStereoPanner(); p.pan.value=pan||0; node.connect(p); p.connect(master); }
    else node.connect(master);
  }
  function tone(t,f0,f1,dur,vol,pan){
    var o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+dur*.22); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); out(g,pan); o.start(t); o.stop(t+dur+.03);
  }
  function song(){
    if(!ctx||!soundOn||ctx.state!=='running') return;
    var t=ctx.currentTime+.02, pan=Math.random()*1.6-.8, k=Math.floor(Math.random()*4), base=2400+Math.random()*1800, i;
    if(k===0){ var n=5+Math.floor(Math.random()*5); for(i=0;i<n;i++) tone(t+i*.075,base,base*1.28,.05,.05,pan); }
    else if(k===1){ tone(t,base*.7,base*1.1,.12,.06,pan); tone(t+.17,base*1.1,base*.75,.15,.06,pan); }
    else if(k===2){ tone(t,base*.6,base*1.05,.34,.05,pan); tone(t+.4,base*1.05,base*.7,.3,.05,pan); }
    else { for(i=0;i<3;i++) tone(t+i*.16,base*.9,base*1.3,.08,.06,pan); }
  }
  function schedule(){
    clearTimeout(birdTimer);
    birdTimer=setTimeout(function(){ song(); if(Math.random()<.35) setTimeout(song,350+Math.random()*500); schedule(); },700+Math.random()*2800);
  }
  function meow(){
    if(!ctx||!soundOn||ctx.state!=='running') return;
    var t=ctx.currentTime, d=.7+Math.random()*.2, base=480+Math.random()*160;
    var o=ctx.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(base*.85,t); o.frequency.linearRampToValueAtTime(base*1.55,t+d*.32); o.frequency.linearRampToValueAtTime(base*.72,t+d);
    var lfo=ctx.createOscillator(), lg=ctx.createGain(); lfo.frequency.value=6.5; lg.gain.value=12; lfo.connect(lg); lg.connect(o.frequency);
    var f1=ctx.createBiquadFilter(), f2=ctx.createBiquadFilter(), mix=ctx.createGain(), g=ctx.createGain();
    f1.type=f2.type='bandpass'; f1.Q.value=5; f2.Q.value=6;
    f1.frequency.setValueAtTime(420,t); f1.frequency.linearRampToValueAtTime(1000,t+d*.4); f1.frequency.linearRampToValueAtTime(620,t+d);
    f2.frequency.setValueAtTime(2200,t); f2.frequency.linearRampToValueAtTime(1500,t+d*.4); f2.frequency.linearRampToValueAtTime(2400,t+d);
    mix.gain.value=3.2;
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.55,t+.08); g.gain.setValueAtTime(.5,t+d*.55); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(f1); o.connect(f2); f1.connect(mix); f2.connect(mix); mix.connect(g); g.connect(master);
    o.start(t); lfo.start(t); o.stop(t+d+.05); lfo.stop(t+d+.05);
  }
  function pop(){ if(ctx&&soundOn&&ctx.state==='running'){ var t=ctx.currentTime; tone(t,340,170,.07,.07,0); } }

  function setSound(on){
    soundOn=on; snd.setAttribute('aria-pressed',on); snd.textContent=on?'Sonido activado':'Sonido en pausa';
    if(master) master.gain.setTargetAtTime(on?1:0,ctx.currentTime,.05);
  }
  function start(){
    initAudio(); if(ctx&&ctx.state!=='running') ctx.resume();
    setSound(true); intro.classList.add('hide'); schedule(); setTimeout(song,300);
  }
  document.getElementById('go').addEventListener('click',start);
  snd.addEventListener('click',function(){ initAudio(); if(ctx.state!=='running') ctx.resume(); setSound(!soundOn); if(soundOn) schedule(); });
  document.addEventListener('visibilitychange',function(){
    if(!ctx) return; if(document.hidden) ctx.suspend(); else if(soundOn) ctx.resume();
  });

  /* ---------- Click on the cat ---------- */
  function poke(e){
    if(e) e.preventDefault();
    meows++; nm.textContent=meows; meow();
    body.animate([{transform:'scale(1)'},{transform:'scale(1.25,.8)'},{transform:'scale(.88,1.15)'},{transform:'scale(1)'}],{duration:380,easing:'ease-out'});
    var a=Math.atan2(vy,vx)+(Math.random()-.5)*1.1;
    vx=Math.cos(a)*speed; vy=Math.sin(a)*speed;
    bubble.style.top=y<50?'100%':'-40px';
    bubble.animate([{opacity:0,transform:'translateX(-50%) translateY(8px) scale(.7)'},{opacity:1,transform:'translateX(-50%) translateY(0) scale(1)',offset:.2},{opacity:1,offset:.7},{opacity:0,transform:'translateX(-50%) translateY(-8px) scale(1)'}],{duration:850,fill:'none'});
  }
  cat.addEventListener('pointerdown',poke);
  cat.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' ') poke(e); });
})();
</script>
