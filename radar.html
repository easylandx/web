<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Madrid Radar Live</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #0b0f14;
    --panel: rgba(12, 18, 26, 0.72);
    --border: rgba(80, 255, 170, 0.25);
    --accent: #3dffa8;
    --text: #d7e3ee;
    --muted: #7f93a6;
    --err: #ff6b6b;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); }
  #map { position: absolute; inset: 0; background: var(--bg); }

  /* Free OpenStreetMap tiles turned into a dark radar look */
  .dark-tiles { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9) saturate(0.6); }

  .hud {
    position: absolute; top: 14px; left: 14px; z-index: 1000;
    padding: 12px 16px; min-width: 210px; max-width: calc(100vw - 100px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color: var(--text);
    pointer-events: none;
  }
  .hud h1 {
    margin: 0 0 6px; font-size: 15px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); font-weight: 600;
  }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .status.live .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 1.6s infinite; }
  .status.live { color: var(--text); }
  .status.error .dot { background: var(--err); box-shadow: 0 0 8px var(--err); }
  .status.error { color: var(--err); }
  @keyframes pulse { 50% { opacity: .35; } }

  /* Plane markers */
  .plane-icon { background: none; border: none; }
  .plane {
    font-size: 22px; line-height: 1; width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    transform-origin: 50% 50%;
    filter: drop-shadow(0 0 4px rgba(61,255,168,.55));
    cursor: pointer;
  }

  /* Dark popup */
  .leaflet-popup-content-wrapper {
    background: rgba(12, 18, 26, 0.94); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,.55);
  }
  .leaflet-popup-tip { background: rgba(12, 18, 26, 0.94); border: 1px solid var(--border); }
  .leaflet-container a.leaflet-popup-close-button { color: var(--muted); }
  .leaflet-container a.leaflet-popup-close-button:hover { color: var(--accent); }
  .leaflet-popup-content { margin: 12px 14px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
  .pop-title { font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: .08em; margin-bottom: 8px; }
  .pop-row { display: flex; justify-content: space-between; gap: 18px; padding: 3px 0; border-top: 1px solid rgba(255,255,255,.06); }
  .pop-row span:first-child { color: var(--muted); }
  .pop-row span:last-child { color: var(--text); font-weight: 600; }

  .leaflet-control-attribution { background: rgba(12,18,26,.6) !important; color: var(--muted) !important; }
  .leaflet-control-attribution a { color: var(--muted) !important; }
</style>
</head>
<body>
<div id="map"></div>

<div class="hud">
  <h1>Madrid Radar Live</h1>
  <div id="status" class="status"><span class="dot"></span><span id="statusText">Fetching data...</span></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>window.L || document.write('<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"><\/script>');</script>
<script>window.L || document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>');</script>
<script>
(function () {
  'use strict';

  if (typeof L === 'undefined') {
    document.getElementById('status').className = 'status error';
    document.getElementById('statusText').textContent = 'Error: map library blocked (cdnjs, jsDelivr and unpkg all unreachable)';
    return;
  }

  // ---- Config ----
  // Comunidad de Madrid bounding box (aircraft outside it are hidden)
  var BBOX = { lamin: 39.8, lomin: -4.6, lamax: 41.2, lomax: -3.0 };
  var CENTER = [40.5, -3.8];
  var RADIUS_NM = 60;            // circle that fully covers the bounding box
  var REFRESH_MS = 10000;

  // Free sources, no API key. Tried in order; the next is used if one fails.
  // adsb.lol and airplanes.live sit behind Cloudflare; in Spain those IPs are
  // often blocked during LaLiga matches, so OpenSky (different host) is the
  // third fallback. Anonymous OpenSky allows ~400 requests/day -> poll slowly.
  function parseAdsb(data) { return data.ac || data.aircraft || []; }

  // Convert OpenSky state vectors to the same shape the adsb.lol feed uses
  function parseOpenSky(data) {
    return (data.states || []).map(function (s) {
      var alt = isNum(s[13]) ? s[13] : s[7];                  // metres
      return {
        hex: s[0],
        flight: s[1],
        country: s[2],
        lon: s[5],
        lat: s[6],
        alt_baro: s[8] ? 'ground' : (isNum(alt) ? alt * 3.28084 : null),  // -> feet
        gs: isNum(s[9]) ? s[9] * 1.94384 : null,              // m/s -> knots
        track: s[10],
        seen_pos: isNum(s[3]) ? Math.max(0, Date.now() / 1000 - s[3]) : null
      };
    });
  }

  var SOURCES = [
    { name: 'adsb.lol', interval: REFRESH_MS, parse: parseAdsb,
      url: 'https://api.adsb.lol/v2/point/' + CENTER[0] + '/' + CENTER[1] + '/' + RADIUS_NM },
    { name: 'airplanes.live', interval: REFRESH_MS, parse: parseAdsb,
      url: 'https://api.airplanes.live/v2/point/' + CENTER[0] + '/' + CENTER[1] + '/' + RADIUS_NM },
  ];

  // Your own CORS relay (see worker.js). Paste its address here, no trailing slash,
  // e.g. 'https://madrid-radar.YOURNAME.workers.dev'. It is tried first.
  var WORKER_URL = 'https://madrid-radar.paniaguai.workers.dev';
  if (WORKER_URL) {
    SOURCES.unshift({
      name: 'relay', interval: REFRESH_MS, parse: parseAdsb,
      url: WORKER_URL + '/point/' + CENTER[0] + '/' + CENTER[1] + '/' + RADIUS_NM
    });
  }

  // The ✈️ glyph points north-east (~45°) in most fonts, so subtract 45°.
  var EMOJI_OFFSET_DEG = 45;

  // Rough country from the ICAO 24-bit address block [from, to, country]
  var ICAO_COUNTRIES = [
    [0x010000,0x017FFF,'Egypt'],[0x020000,0x027FFF,'Morocco'],[0x0A0000,0x0A7FFF,'Algeria'],
    [0x0D0000,0x0D7FFF,'Mexico'],[0x140000,0x15FFFF,'Russia'],
    [0x300000,0x33FFFF,'Italy'],[0x340000,0x37FFFF,'Spain'],[0x380000,0x3BFFFF,'France'],
    [0x3C0000,0x3FFFFF,'Germany'],[0x400000,0x43FFFF,'United Kingdom'],
    [0x440000,0x447FFF,'Austria'],[0x448000,0x44FFFF,'Belgium'],[0x458000,0x45FFFF,'Denmark'],
    [0x460000,0x467FFF,'Finland'],[0x468000,0x46FFFF,'Greece'],[0x470000,0x477FFF,'Hungary'],
    [0x478000,0x47FFFF,'Norway'],[0x480000,0x487FFF,'Netherlands'],[0x488000,0x48FFFF,'Poland'],
    [0x490000,0x497FFF,'Portugal'],[0x498000,0x49FFFF,'Czechia'],[0x4A0000,0x4A7FFF,'Sweden'],
    [0x4A8000,0x4AFFFF,'Romania'],[0x4B0000,0x4B7FFF,'Switzerland'],[0x4B8000,0x4BFFFF,'Turkey'],
    [0x4CA000,0x4CAFFF,'Ireland'],[0x4CC000,0x4CCFFF,'Iceland'],[0x4D0000,0x4D03FF,'Luxembourg'],
    [0x4D2000,0x4D23FF,'Malta'],[0x508000,0x50FFFF,'Ukraine'],
    [0x710000,0x717FFF,'Saudi Arabia'],[0x718000,0x71FFFF,'South Korea'],[0x738000,0x73FFFF,'Israel'],
    [0x760000,0x767FFF,'Singapore'],[0x780000,0x7BFFFF,'China'],[0x7C0000,0x7FFFFF,'Australia'],
    [0x800000,0x83FFFF,'India'],[0x840000,0x87FFFF,'Japan'],[0x896000,0x896FFF,'United Arab Emirates'],
    [0xA00000,0xAFFFFF,'United States'],[0xC00000,0xC3FFFF,'Canada'],
    [0xE00000,0xE3FFFF,'Argentina'],[0xE40000,0xE7FFFF,'Brazil']
  ];
  function countryFromHex(hex) {
    if (!hex || hex.charAt(0) === '~') return 'Unknown';
    var n = parseInt(hex, 16);
    if (!isFinite(n)) return 'Unknown';
    for (var i = 0; i < ICAO_COUNTRIES.length; i++) {
      if (n >= ICAO_COUNTRIES[i][0] && n <= ICAO_COUNTRIES[i][1]) return ICAO_COUNTRIES[i][2];
    }
    return 'Unknown';
  }

  // ---- Map ----
  var map = L.map('map', { center: [40.4167, -3.7038], zoom: 9, zoomControl: false });
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors | Data: adsb.lol / airplanes.live',
    maxZoom: 19,
    className: 'dark-tiles'
  }).addTo(map);

  L.rectangle([[BBOX.lamin, BBOX.lomin], [BBOX.lamax, BBOX.lomax]], {
    color: '#3dffa8', weight: 1, opacity: 0.25, fill: false, dashArray: '4 6', interactive: false
  }).addTo(map);

  var markerLayer = L.layerGroup().addTo(map);
  var markers = {};      // one marker per aircraft, reused between refreshes
  var routeCache = {};   // callsign -> {o, d, airline} | null | 'loading'

  // ---- UI helpers ----
  var statusEl = document.getElementById('status');
  var statusText = document.getElementById('statusText');
  function setStatus(text, kind) {
    statusText.textContent = text;
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }
  function esc(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function isNum(v) { return typeof v === 'number' && isFinite(v); }
  function row(k, v) {
    return '<div class="pop-row"><span>' + esc(k) + '</span><span>' + esc(v) + '</span></div>';
  }

  function airportLabel(ap) {
    if (!ap) return 'N/A';
    var code = ap.iata_code || ap.icao_code || '';
    var city = ap.municipality || ap.name || '';
    return (code + ' ' + city).trim() || 'N/A';
  }
  function routeRows(callsign) {
    var cs = (callsign || '').toUpperCase();
    if (!cs) return '';
    var r = routeCache[cs];
    if (r === undefined || r === 'loading') return row('Route', 'Loading...');
    if (r.fail) return row('Route', r.fail);
    return (r.airline ? row('Airline', r.airline) : '') +
           row('From', airportLabel(r.o)) +
           row('To', airportLabel(r.d));
  }
  function getJson(path) {
    return fetch(WORKER_URL + path).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }
  // Source 1: adsbdb.com (by callsign)
  function fromAdsbdb(d) {
    var fr = d && d.response && typeof d.response === 'object' ? d.response.flightroute : null;
    return fr && fr.origin && fr.destination
      ? { o: fr.origin, d: fr.destination, airline: fr.airline && fr.airline.name }
      : null;
  }
  // Source 2: adsb.lol routeset (by callsign + position)
  function fromRouteset(d) {
    var e = Array.isArray(d) ? d[0] : d;
    if (!e || e.plausible === false) return null;
    var aps = e._airports;
    if (Array.isArray(aps) && aps.length >= 2) {
      var f = aps[0], t = aps[aps.length - 1];
      return {
        o: { iata_code: f.iata, icao_code: f.icao, municipality: f.location, name: f.name },
        d: { iata_code: t.iata, icao_code: t.icao, municipality: t.location, name: t.name }
      };
    }
    var codes = String(e._airport_codes_iata || e.airport_codes || '').split('-');
    if (codes.length >= 2 && codes[0] && codes[codes.length - 1]) {
      return { o: { iata_code: codes[0] }, d: { iata_code: codes[codes.length - 1] } };
    }
    return null;
  }
  function loadRoute(ac) {
    var cs = ac && ac.flight ? String(ac.flight).trim().toUpperCase() : '';
    if (!cs) return Promise.resolve();
    var cur = routeCache[cs];
    if (cur && !cur.retry) return Promise.resolve();    // cached, or already loading
    routeCache[cs] = 'loading';
    var errA = null, errB = null;
    return getJson('/route/' + encodeURIComponent(cs)).then(fromAdsbdb)
      .catch(function (e) { errA = e; return null; })
      .then(function (r) {
        if (r) return r;
        return getJson('/routeset/' + encodeURIComponent(cs) + '/' + ac.lat + '/' + ac.lon).then(fromRouteset)
          .catch(function (e) { errB = e; return null; });
      })
      .then(function (r) {
        routeCache[cs] = r ||
          (errA && errB ? { fail: 'Lookup failed (' + errA.message + ')', retry: true }
                        : { fail: 'Not in database' });
      });
  }
  function onPopupOpen(e) {
    var m = e.target;
    loadRoute(m._ac).then(function () {
      if (m.isPopupOpen()) m.getPopup().setContent(popupHtml(m._ac));
    });
  }

  function popupHtml(a) {
    var callsign = a.flight ? String(a.flight).trim() : '';
    var onGround = a.alt_baro === 'ground';
    var altTxt = onGround ? 'On ground'
               : isNum(a.alt_baro) ? Math.round(a.alt_baro).toLocaleString('en-US') + ' ft' : 'N/A';
    var spdTxt = isNum(a.gs) ? Math.round(a.gs) + ' kt' : 'N/A';
    var hdg = isNum(a.track) ? a.track : a.true_heading;
    var hdgTxt = isNum(hdg) ? Math.round(hdg) + '°' : 'N/A';

    return '<div class="pop-title">' + esc(callsign || a.r || a.hex || 'N/A') + '</div>' +
      row('Callsign', callsign || 'N/A') +
      row('Country', a.country ? a.country : countryFromHex(a.hex) + ' *') +
      row('Altitude', altTxt) +
      row('Ground speed', spdTxt) +
      row('Heading', hdgTxt) +
      routeRows(callsign) +
      (a.r ? row('Registration', a.r) : '') +
      (a.t ? row('Aircraft type', a.t) : '') +
      '<div style="margin-top:6px;color:var(--muted);font-size:10px">* country of registration, estimated from ICAO address</div>';
  }

  function planeIcon(heading) {
    var rot = (isNum(heading) ? heading : 0) - EMOJI_OFFSET_DEG;
    return L.divIcon({
      className: 'plane-icon',
      html: '<div class="plane" style="transform: rotate(' + rot + 'deg);">✈️</div>',
      iconSize: [24, 24], iconAnchor: [12, 12], popupAnchor: [0, -10]
    });
  }

  // ---- Data ----
  async function fetchAircraft() {
    var errors = [];
    for (var i = 0; i < SOURCES.length; i++) {
      var src = SOURCES[i];
      var timer = null;
      try {
        // No AbortController: sandboxed viewers can't clone AbortSignal, so race a timer instead
        var res = await Promise.race([
          fetch(src.url),
          new Promise(function (_, reject) {
            timer = setTimeout(function () { reject(new Error('timeout')); }, 8000);
          })
        ]);
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var data = await res.json();
        return { list: src.parse(data), source: src.name, interval: src.interval };
      } catch (e) {
        clearTimeout(timer);
        console.warn(src.name + ' failed:', e);
        errors.push(src.name + ' ' + (e && e.name === 'AbortError' ? 'timeout' : (e && e.message) || 'error'));
      }
    }
    throw new Error('all sources failed (' + errors.join(', ') + ')');
  }

  async function update() {
    var nextIn = 15000;   // retry delay after a total failure
    try {
      setStatus('Fetching data...', '');
      var out = await fetchAircraft();

      var seen = {};
      var count = 0;
      out.list.forEach(function (a) {
        if (!isNum(a.lat) || !isNum(a.lon)) return;
        if (a.lat < BBOX.lamin || a.lat > BBOX.lamax || a.lon < BBOX.lomin || a.lon > BBOX.lomax) return;
        if (isNum(a.seen_pos) && a.seen_pos > 60) return;   // stale position
        var hdg = isNum(a.track) ? a.track : a.true_heading;
        var key = a.hex || (a.flight + '|' + a.r);
        seen[key] = true;
        var m = markers[key];
        if (m) {
          m._ac = a;
          m.setLatLng([a.lat, a.lon]);
          m.setIcon(planeIcon(hdg));
          if (m.isPopupOpen()) m.getPopup().setContent(popupHtml(a));
        } else {
          m = L.marker([a.lat, a.lon], { icon: planeIcon(hdg), keyboard: false });
          m._ac = a;
          m.bindPopup(function (layer) { return popupHtml(layer._ac); }, { closeButton: true, autoPan: true });
          m.on('popupopen', onPopupOpen);
          m.addTo(markerLayer);
          markers[key] = m;
        }
        count++;
      });
      Object.keys(markers).forEach(function (k) {
        if (!seen[k]) { markerLayer.removeLayer(markers[k]); delete markers[k]; }
      });

      nextIn = out.interval;
      setStatus('Live: ' + count + ' flight' + (count === 1 ? '' : 's') + ' tracked (' + out.source + ')', 'live');
    } catch (err) {
      console.error(err);
      setStatus('Error: ' + (err && err.message ? err.message : 'request failed') + ' — retrying...', 'error');
    } finally {
      setTimeout(update, nextIn);
    }
  }

  update();
})();
</script>
</body>
</html>
