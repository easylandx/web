<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deep10 — Direct WebRTC + Text Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-dark: #0b0f17;
      --card-bg: #131924;
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-cyan: #00f0ff;
      --accent-amber: #ffb703;
      --accent-green: #25d366;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --radius-lg: 20px;
      --radius-md: 12px;
      --font-heading: 'Space Grotesk', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(0, 240, 255, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(255, 183, 3, 0.06) 0%, transparent 40%);
    }

    .container { width: 100%; max-width: 900px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 20px; }

    .logo {
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .logo-badge {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      background: rgba(0, 240, 255, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 3px 8px;
      border-radius: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    /* Form Controls */
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; }
    input[type="text"] {
      width: 100%; background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-md); padding: 12px 16px;
      color: #fff; font-size: 1rem;
    }

    .btn {
      width: 100%; padding: 14px; border: none; border-radius: var(--radius-md);
      font-family: var(--font-heading); font-size: 1rem; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-cyan { background: var(--accent-cyan); color: #0b0f17; }
    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid rgba(255, 255, 255, 0.1); }

    /* Call Screen Grid */
    .call-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 16px;
    }
    @media (max-width: 768px) {
      .call-layout { grid-template-columns: 1fr; }
    }

    .video-grid {
      display: grid;
      grid-template-rows: 1fr 1fr;
      gap: 12px;
      height: 420px;
    }

    .video-box {
      background: #000;
      border-radius: var(--radius-md);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,0.1);
    }

    video { width: 100%; height: 100%; object-fit: cover; }

    .video-placeholder {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .avatar-icon {
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(255,255,255,0.1); display: flex;
      align-items: center; justify-content: center; font-size: 1.2rem;
    }

    /* Chat Section */
    .chat-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      height: 420px;
    }

    .chat-header {
      padding: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    .chat-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 0.85rem;
    }

    .msg {
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 85%;
      word-break: break-word;
    }
    .msg.me { background: rgba(0, 240, 255, 0.2); align-self: flex-end; color: #fff; }
    .msg.peer { background: rgba(255, 255, 255, 0.1); align-self: flex-start; color: #fff; }
    .msg.sys { background: transparent; color: var(--text-muted); font-size: 0.75rem; text-align: center; align-self: center; }

    .chat-input-area {
      padding: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      gap: 6px;
    }

    .chat-input-area input {
      flex: 1; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px; padding: 8px 12px; color: #fff; font-size: 0.85rem;
    }

    .chat-input-area button {
      background: var(--accent-cyan); border: none; padding: 8px 12px;
      border-radius: 6px; font-weight: 700; cursor: pointer; color: #000;
    }

    /* Timer Header */
    .timer-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0,0,0,0.4); padding: 10px 16px; border-radius: var(--radius-md); margin-bottom: 12px;
    }
    .timer-val { font-family: var(--font-mono); font-weight: 700; font-size: 1.2rem; color: var(--accent-amber); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="logo">DEEP 10 <span class="logo-badge">In-Browser P2P</span></div>
      <p style="color: var(--text-muted); font-size: 0.9rem;">10 minutes of genuine human connection (Video or Text Chat).</p>
    </header>

    <main class="card">
      <!-- SETUP SCREEN -->
      <div id="screen-setup" class="screen active">
        <h2 style="font-family: var(--font-heading); margin-bottom: 16px;">Join a 10-Minute Session</h2>
        
        <div class="form-group">
          <label>Your Display Name</label>
          <input type="text" id="user-name" placeholder="e.g. Alex" value="Alex">
        </div>

        <button class="btn btn-cyan" onclick="initHost()">Create Room & Wait for Match</button>
        <div style="text-align: center; margin: 16px 0; color: var(--text-muted); font-size: 0.8rem;">— OR ENTER ROOM CODE —</div>
        
        <div class="form-group">
          <input type="text" id="join-code" placeholder="Enter Room Code (e.g. 482019)">
        </div>
        <button class="btn btn-secondary" onclick="joinPeer()">Join Room</button>
      </div>

      <!-- CALL & CHAT SCREEN -->
      <div id="screen-call" class="screen">
        <div class="timer-bar">
          <span style="font-size: 0.85rem; color: var(--text-muted);">Session Active</span>
          <div class="timer-val" id="timer-display">10:00</div>
          <button style="background: rgba(255,255,255,0.1); border:none; color:#fff; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:0.75rem;" onclick="endCall()">End Call</button>
        </div>

        <div class="call-layout">
          <!-- Video Container -->
          <div class="video-grid">
            <!-- Remote Stream -->
            <div class="video-box">
              <video id="remote-video" autoplay playsinline></video>
              <div class="video-placeholder" id="remote-placeholder">
                <div class="avatar-icon">👤</div>
                <span>Partner Stream / Text Mode</span>
              </div>
            </div>
            <!-- Local Stream -->
            <div class="video-box">
              <video id="local-video" autoplay playsinline muted></video>
              <div class="video-placeholder" id="local-placeholder">
                <div class="avatar-icon">📷</div>
                <span>No Camera Active (Text Enabled)</span>
              </div>
            </div>
          </div>

          <!-- Integrated Text Chat -->
          <div class="chat-box">
            <div class="chat-header">
              <span>Text Chat</span>
              <span id="chat-status" style="color: var(--accent-green); font-size: 0.75rem;">Connected</span>
            </div>
            <div class="chat-messages" id="chat-messages">
              <div class="msg sys">Welcome to Deep10! Say hi below.</div>
            </div>
            <div class="chat-input-area">
              <input type="text" id="chat-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
              <button onclick="sendMessage()">Send</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
    let peer = null;
    let conn = null;
    let localStream = null;
    let secondsLeft = 600;
    let timerInterval = null;

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    async function setupCamera() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        const localVideo = document.getElementById('local-video');
        localVideo.srcObject = localStream;
        document.getElementById('local-placeholder').style.display = 'none';
      } catch (err) {
        console.warn("Camera/Mic denied or unavailable. Proceeding in Text-Only mode.");
        document.getElementById('local-placeholder').style.display = 'flex';
      }
    }

    function initHost() {
      setupCamera();
      const code = Math.floor(100000 + Math.random() * 900000).toString();
      peer = new Peer('deep10-' + code);

      peer.on('open', (id) => {
        alert(`Room Created! Share this code with your peer: ${code}`);
        showScreen('screen-call');
        startTimer();
      });

      peer.on('connection', (c) => {
        conn = c;
        setupDataChannel();
      });

      peer.on('call', (call) => {
        call.answer(localStream);
        call.on('stream', (remoteStream) => {
          document.getElementById('remote-video').srcObject = remoteStream;
          document.getElementById('remote-placeholder').style.display = 'none';
        });
      });
    }

    function joinPeer() {
      const code = document.getElementById('join-code').value.trim();
      if (!code) return alert('Enter a room code');
      setupCamera();

      peer = new Peer();
      peer.on('open', () => {
        conn = peer.connect('deep10-' + code);
        setupDataChannel();

        if (localStream) {
          const call = peer.call('deep10-' + code, localStream);
          call.on('stream', (remoteStream) => {
            document.getElementById('remote-video').srcObject = remoteStream;
            document.getElementById('remote-placeholder').style.display = 'none';
          });
        }
        showScreen('screen-call');
        startTimer();
      });
    }

    function setupDataChannel() {
      conn.on('data', (data) => {
        if (data.type === 'msg') {
          appendMessage(data.sender, data.text, 'peer');
        }
      });
    }

    function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;

      appendMessage('Me', text, 'me');
      if (conn && conn.open) {
        conn.send({ type: 'msg', sender: document.getElementById('user-name').value, text: text });
      }
      input.value = '';
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    function appendMessage(sender, text, type) {
      const msgBox = document.getElementById('chat-messages');
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerText = `${sender}: ${text}`;
      msgBox.appendChild(div);
      msgBox.scrollTop = msgBox.scrollHeight;
    }

    function startTimer() {
      secondsLeft = 600;
      timerInterval = setInterval(() => {
        secondsLeft--;
        const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
        const s = (secondsLeft % 60).toString().padStart(2, '0');
        document.getElementById('timer-display').innerText = `${m}:${s}`;
        if (secondsLeft <= 0) {
          clearInterval(timerInterval);
          alert("10 Minutes complete!");
        }
      }, 1000);
    }

    function endCall() {
      if (timerInterval) clearInterval(timerInterval);
      location.reload();
    }
  </script>
</body>
</html>
