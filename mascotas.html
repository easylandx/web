.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:16px 0 6px}

$('#bar').innerHTML=D.steps.map((s,i)=>`<button class="seg" style="flex-grow:${D.stepmin[i]}" aria-label="${T.stage} ${i+1}: ${s[0]}" aria-pressed="false">${i+1}</button>`).join('');
$('#tt').textContent='≈ '+dur(tot);
function step(i){$$('.seg').forEach((b,j)=>b.setAttribute('aria-pressed',j==i));let a=D.stepmin.slice(0,i).reduce((x,y)=>x+y,0);
 $('#dn').textContent=i+1;$('#dh').textContent=D.steps[i][0];$('#dp').textContent=D.steps[i][1]+' ('+D.stepmin[i]+' '+T.min+', '+a+'–'+(a+D.stepmin[i])+' '+T.min+')';}
$$('.seg').forEach((b,i)=>b.onclick=()=>step(i));step(0);
// equipo, galería, lista
$('#team').innerHTML=D.team.map(m=>`<div><h3>${m[0]}</h3><em>${m[1]}</em><p>${m[2]}</p></div>`).join('');
$('#gal').innerHTML=['salon','bano','prod','result'].map((k,i)=>`<figure><img src="${IM[k]}" alt="${D.alt[k]}"><figcaption>${D.gal[i]}</figcaption></figure>`).join('');
$('#chk').innerHTML=D.checks.map(c=>`<label class="chk"><input type="checkbox"><span>${c}</span></label>`).join('');
const cc=()=>$('#cnt').textContent=T.counter.replace('{n}',$$('#chk input:checked').length).replace('{m}',D.checks.length);
$('#chk').addEventListener('change',cc);cc();
// navegación
const book=$('#book'),pgs=$$('.pg'),dots=$('#dots');let cur=0;
dots.innerHTML=D.pages.map((p,i)=>`<button aria-label="${p}" data-go="${i}"></button>`).join('');
$('#prev').setAttribute('aria-label',D.prev);$('#next').setAttribute('aria-label',D.next);
function show(i){cur=i;$$('#dots button').forEach((d,j)=>d.setAttribute('aria-current',j==i));$('#ttl').textContent=(i+1)+'/'+pgs.length+' · '+D.pages[i];$('#prev').disabled=i==0;$('#next').disabled=i==pgs.length-1;}
function go(i){i=Math.max(0,Math.min(pgs.length-1,i));book.scrollTo({left:i*book.clientWidth,behavior:'smooth'});show(i);}
$$('[data-go]').forEach(b=>b.addEventListener('click',()=>go(+b.dataset.go)));
$('#prev').onclick=()=>go(cur-1);$('#next').onclick=()=>go(cur+1);
book.addEventListener('scroll',()=>{const i=Math.round(book.scrollLeft/book.clientWidth);if(i!==cur)show(i)},{passive:true});
addEventListener('resize',()=>book.scrollTo({left:cur*book.clientWidth,behavior:'instant'}));
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
show(0);
</script>
</body>
</html>
